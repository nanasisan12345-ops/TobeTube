name: Update YouTube catalog

on:
  workflow_dispatch:
    inputs:
      popular_limit:
        description: Number of low-cost regional popular chart requests
        required: true
        default: "1000"
      limit:
        description: Number of country and genre searches
        required: true
        default: "50"
      target_count:
        description: Target videos per country and genre
        required: true
        default: "50"
      discovery_limit:
        description: Number of discovery searches
        required: true
        default: "45"
      discovery_target_count:
        description: Target discovery videos per country and genre
        required: true
        default: "12"
      country:
        description: Optional country id such as jp
        required: false
      genre:
        description: Optional genre id such as game
        required: false
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-youtube-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Check API key
        if: env.YOUTUBE_API_KEY == ''
        run: echo "YOUTUBE_API_KEY is not configured; catalog update was skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: env.YOUTUBE_API_KEY != ''
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.YOUTUBE_API_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Expand country and genre video pools
        if: env.YOUTUBE_API_KEY != ''
        env:
          SYNC_POPULAR_LIMIT: ${{ inputs.popular_limit || '1000' }}
          SYNC_LIMIT: ${{ inputs.limit || '50' }}
          SYNC_TARGET_COUNT: ${{ inputs.target_count || '50' }}
          SYNC_DISCOVERY_LIMIT: ${{ inputs.discovery_limit || '45' }}
          SYNC_DISCOVERY_TARGET_COUNT: ${{ inputs.discovery_target_count || '12' }}
          SYNC_COUNTRY: ${{ inputs.country }}
          SYNC_GENRE: ${{ inputs.genre }}
        run: |
          popular_args=("--limit=$SYNC_POPULAR_LIMIT" "--target-count=$SYNC_TARGET_COUNT")
          if [ -n "$SYNC_COUNTRY" ]; then popular_args+=("--country=$SYNC_COUNTRY"); fi
          if [ -n "$SYNC_GENRE" ]; then popular_args+=("--genre=$SYNC_GENRE"); fi
          npm run sync:youtube:popular -- "${popular_args[@]}"

          args=("--limit=$SYNC_LIMIT" "--target-count=$SYNC_TARGET_COUNT" "--discovery-limit=$SYNC_DISCOVERY_LIMIT" "--discovery-target-count=$SYNC_DISCOVERY_TARGET_COUNT")
          if [ -n "$SYNC_COUNTRY" ]; then args+=("--country=$SYNC_COUNTRY"); fi
          if [ -n "$SYNC_GENRE" ]; then args+=("--genre=$SYNC_GENRE"); fi
          npm run sync:youtube -- "${args[@]}"

      - name: Verify catalog and site
        if: env.YOUTUBE_API_KEY != ''
        run: |
          npm test
          npm run validate:data
          npm run validate:site
          npm run coverage

      - name: Commit catalog update
        if: env.YOUTUBE_API_KEY != ''
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "No catalog changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "Update YouTube video catalog"
          git push
