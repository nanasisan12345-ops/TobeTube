name: Update YouTube catalog

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of country and genre searches
        required: true
        default: "90"
      target_count:
        description: Target videos per country and genre
        required: true
        default: "50"
      country:
        description: Optional country id such as jp
        required: false
      genre:
        description: Optional genre id such as game
        required: false
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: update-youtube-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Check API key
        if: env.YOUTUBE_API_KEY == ''
        run: echo "YOUTUBE_API_KEY is not configured; catalog update was skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: env.YOUTUBE_API_KEY != ''
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.YOUTUBE_API_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Expand country and genre video pools
        if: env.YOUTUBE_API_KEY != ''
        env:
          SYNC_LIMIT: ${{ inputs.limit || '90' }}
          SYNC_TARGET_COUNT: ${{ inputs.target_count || '50' }}
          SYNC_COUNTRY: ${{ inputs.country }}
          SYNC_GENRE: ${{ inputs.genre }}
        run: |
          args=("--limit=$SYNC_LIMIT" "--target-count=$SYNC_TARGET_COUNT")
          if [ -n "$SYNC_COUNTRY" ]; then args+=("--country=$SYNC_COUNTRY"); fi
          if [ -n "$SYNC_GENRE" ]; then args+=("--genre=$SYNC_GENRE"); fi
          npm run sync:youtube -- "${args[@]}"

      - name: Verify catalog and site
        if: env.YOUTUBE_API_KEY != ''
        run: |
          npm test
          npm run validate:data
          npm run validate:site
          npm run coverage

      - name: Commit catalog update
        if: env.YOUTUBE_API_KEY != ''
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "No catalog changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "Update YouTube video catalog"
          git push
